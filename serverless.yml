org: matiaswalde
service: alertaUtec

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  iam:
    role: arn:aws:iam::598447946208:role/LabRole
  deploymentMethod: direct
  environment:
    incidents_table: incidents
    users_table: users
    places_table: places
    uploads_bucket: alerta-utec-bucket
    JWT_SECRET: test_secret # solo para pruebas
    sessions_table: sessions
    connections_table: connections
    WS_ENDPOINT:
      Fn::Join:
        - ""
        - - "https://"
          - Ref: WebSocketApi
          - ".execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"

resources:
  Resources:

    ## -----------------------------------------------------
    ## bucket (fotos y videos)
    ## -----------------------------------------------------
    AlertaUtecBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: alerta-utec-bucket
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: ["GET", "PUT"]
              AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: ExpireUploads
              Status: Enabled
              ExpirationInDays: 30

    ## -----------------------------------------------------
    ## tabla users
    ## -----------------------------------------------------
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: type
            AttributeType: S
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: type
            KeyType: HASH
          - AttributeName: user_id
            KeyType: RANGE

    ## -----------------------------------------------------
    ## tabla places
    ## -----------------------------------------------------
    PlacesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: places
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: place_id
            AttributeType: S
        KeySchema:
          - AttributeName: place_id
            KeyType: HASH

    ## -----------------------------------------------------
    ## tabla incidents
    ## -----------------------------------------------------
    IncidentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: incidents
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: incident_id
            AttributeType: S
          - AttributeName: state
            AttributeType: S
          - AttributeName: category
            AttributeType: S
          - AttributeName: reporter_id
            AttributeType: S
          - AttributeName: solver_id
            AttributeType: S
          - AttributeName: time_created
            AttributeType: S
          - AttributeName: time_resolved
            AttributeType: S
          - AttributeName: place_id
            AttributeType: S
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        KeySchema:
          - AttributeName: incident_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: state_category_index
            KeySchema:
              - AttributeName: state
                KeyType: HASH
              - AttributeName: category
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: reporter_history_index
            KeySchema:
              - AttributeName: reporter_id
                KeyType: HASH
              - AttributeName: time_created
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: solver_history_index
            KeySchema:
              - AttributeName: solver_id
                KeyType: HASH
              - AttributeName: time_resolved
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: place_history_index
            KeySchema:
              - AttributeName: place_id
                KeyType: HASH
              - AttributeName: time_created
                KeyType: RANGE
            Projection:
              ProjectionType: ALL


    ## -----------------------------------------------------
    ## tabla sessions
    ## -----------------------------------------------------
    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sessions
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    ## -----------------------------------------------------
    ## tabla connections
    ## -----------------------------------------------------
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connection_id
            AttributeType: S
        KeySchema:
          - AttributeName: connection_id
            KeyType: HASH

    ## -----------------------------------------------------
    ## websocketapi
    ## -----------------------------------------------------
    WebSocketApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: alerta-utec-websocket
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: $request.body.action

  Outputs:
    UploadsBucketName:
      Value: !Ref AlertaUtecBucket
    WebSocketApiId:
      Value: !Ref WebSocketApi

functions:
  get_incidents:
    handler: get_incidents.lambda_handler
    events:
      - httpApi:
          path: /incidents
          method: get
  report_incident:
    handler: report_incident.lambda_handler
    events:
      - httpApi:
          path: /incidents
          method: post
  solve_incident:
    handler: solve_incident.lambda_handler
    events:
      - httpApi:
          path: /incidents/{incident_id}/resolve
          method: patch

# -----------------------------------------------
# websocket
# -----------------------------------------------
  connect_handler:
    handler: websocket/connect.lambda_handler
    events:
      - websocket:
          route: $connect

  disconnect_handler:
    handler: websocket/disconnect.lambda_handler
    events:
      - websocket:
          route: $disconnect

  default_handler:
    handler: websocket/default.lambda_handler
    events:
      - websocket:
          route: $default

  send_update_handler:
    handler: websocket/send_update.lambda_handler
    events:
      - websocket:
          route: send_update

  auto_update_handler:
    handler: websocket/auto_update.lambda_handler
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - IncidentsTable
              - StreamArn