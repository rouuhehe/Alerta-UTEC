org: matiaswalde
service: alertaUtec

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  iam:
    role: arn:aws:iam::598447946208:role/LabRole
  deploymentMethod: direct
  environment:
    incidents_table: incidents
    users_table: users
    places_table: places
    uploads_bucket: alerta-utec-bucket
    JWT_SECRET: test_secret # solo para pruebas
    ADMIN_MASTER_KEY: uwu12345
    sessions_table: sessions
    connections_table: connections
    USER_REGISTER_TOPIC: !Ref UserRegisterTopic
    WS_ENDPOINT:
      Fn::Join:
        - ""
        - - "https://"
          - Ref: WebSocketApi
          - ".execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"
  iamRoleStatements:
      - Effect: Allow
        Action:
          - sns:Subscribe
          - sns:Publish
        Resource:
          - Ref: UserRegisterTopic
resources:
  Resources:
    UserRegisterTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: alertaUtecUserRegistered
    
    ## Bucket S3
    AlertaUtecBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: alerta-utec-bucket
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: ["GET", "PUT"]
              AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: ExpireUploads
              Status: Enabled
              ExpirationInDays: 30

    ## DynamoDB Users
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: type
            AttributeType: S
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: type
            KeyType: HASH
          - AttributeName: user_id
            KeyType: RANGE

    ## DynamoDB Places
    PlacesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: places
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: place_id
            AttributeType: S
        KeySchema:
          - AttributeName: place_id
            KeyType: HASH

    ## DynamoDB Incidents
    IncidentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: incidents
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: incident_id
            AttributeType: S
          - AttributeName: state
            AttributeType: S
          - AttributeName: category
            AttributeType: S
          - AttributeName: reporter_id
            AttributeType: S
          - AttributeName: solver_id
            AttributeType: S
          - AttributeName: time_created
            AttributeType: S
          - AttributeName: time_resolved
            AttributeType: S
          - AttributeName: place_id
            AttributeType: S
        KeySchema:
          - AttributeName: incident_id
            KeyType: HASH
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        GlobalSecondaryIndexes:
          - IndexName: state_category_index
            KeySchema:
              - AttributeName: state
                KeyType: HASH
              - AttributeName: category
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: reporter_history_index
            KeySchema:
              - AttributeName: reporter_id
                KeyType: HASH
              - AttributeName: time_created
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: solver_history_index
            KeySchema:
              - AttributeName: solver_id
                KeyType: HASH
              - AttributeName: time_resolved
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: place_history_index
            KeySchema:
              - AttributeName: place_id
                KeyType: HASH
              - AttributeName: time_created
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ## DynamoDB Sessions
    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sessions
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: session_id
            AttributeType: S
        KeySchema:
          - AttributeName: session_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    ## DynamoDB Connections
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connection_id
            AttributeType: S
        KeySchema:
          - AttributeName: connection_id
            KeyType: HASH

    ## WebSocket API
    WebSocketApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: alerta-utec-websocket
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: $request.body.action

  Outputs:
    UploadsBucketName:
      Value: !Ref AlertaUtecBucket
    WebSocketApiId:
      Value: !Ref WebSocketApi

functions:
  ## HTTP Functions
  get_incidents:
    handler: get_incidents.lambda_handler
    events:
      - httpApi:
          path: /incidents
          method: get

  get_incidents_paginated:
    handler: get_incidents_paginated.lambda_handler
    events:
      - httpApi:
          path: /incidents/paginated
          method: get

  report_incident:
    handler: report_incident.lambda_handler
    events:
      - httpApi:
          path: /incidents
          method: post

  solve_incident:
    handler: solve_incident.lambda_handler
    events:
      - httpApi:
          path: /incidents/{incident_id}/resolve
          method: patch

  get_incident_by_id:
    handler: get_incident_by_id.lambda_handler
    events:
      - httpApi:
          path: /incidents/{incident_id}
          method: get

  assign_incident:
    handler: assign_incident.lambda_handler
    events:
      - httpApi:
          path: /incidents/{incident_id}/assign
          method: patch

  register_user:
    handler: register_user.lambda_handler
    events:
      - httpApi:
          path: /auth/register
          method: post

  list_users_by_type:
    handler: list_users_by_type.lambda_handler
    events:
      - httpApi:
          path: /users
          method: get

  update_user:
    handler: update_user.lambda_handler
    events:
      - httpApi:
          path: /users/{type}/{user_id}
          method: patch
  
  get_user_by_id:
    handler: get_user_by_id.lambda_handler
    events:
      - httpApi:
          path: /users/{type}/{user_id}
          method: get

  login:
    handler: login.lambda_handler
    events:
      - httpApi:
          path: /auth/login
          method: post

  verify_token:
    handler: verify_token.lambda_handler
    events:
      - httpApi:
          path: /auth/verify
          method: post

  ## WebSocket Functions
  connect_handler:
    handler: websocket/connect.lambda_handler
    events:
      - websocket:
          route: $connect

  disconnect_handler:
    handler: websocket/disconnect.lambda_handler
    events:
      - websocket:
          route: $disconnect

  default_handler:
    handler: websocket/default.lambda_handler
    events:
      - websocket:
          route: $default

  send_update_handler:
    handler: websocket/send_update.lambda_handler
    events:
      - websocket:
          route: send_update

  auto_update_handler:
    handler: websocket/auto_update.lambda_handler
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - IncidentsTable
              - StreamArn
  subscribe_user_to_topic:
  handler: subscribe_user.lambda_handler
  events:
    - httpApi:
        path: /auth/subscribe
        method: post

